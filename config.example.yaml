# capture configuration
# Place at ~/.config/capture/config.yaml or set CAPTURE_CONFIG env var

# Where notes are saved (default: ~/Notes)
# notes_dir: ~/Notes

# Staging folder for iOS Shortcut captures (default: ~/Notes/_capture-staging)
# capture_dir: ~/Notes/_capture-staging

# Path to a whisper-dictionary.yaml for custom vocabulary / corrections
# whisper_dictionary: null

# Editor for text captures (default: nano)
# editor: nano

# Per-feature model providers — each stage picks its own backend
providers:
  transcription:
    default: whisper_local          # whisper_local | gemini_flash | disabled
    whisper_local:
      model: medium                 # tiny, base, small, medium, large
      backend: python               # python | cli
    gemini_flash:
      model: gemini-2.0-flash
      api_key: env:GOOGLE_API_KEY
      timeout: 120

  ocr:
    default: apple_vision           # apple_vision | tesseract | disabled
    apple_vision:
      recognition_level: accurate   # accurate | fast
      language_correction: true
    tesseract:
      lang: eng

  title:
    default: ollama_local           # ollama_local | gemini_flash | truncate | disabled
    ollama_local:
      model: qwen-capable
      timeout: 20
    gemini_flash:
      model: gemini-2.0-flash
      api_key: env:GOOGLE_API_KEY
      timeout: 20

  tags:
    default: ollama_local           # ollama_local | gemini_flash | disabled
    ollama_local:
      model: qwen-capable
      timeout: 15
    gemini_flash:
      model: gemini-2.0-flash
      api_key: env:GOOGLE_API_KEY
      timeout: 15

  correction:
    default: ollama_local           # ollama_local | gemini_flash | claude | disabled
    ollama_local:
      model: qwen-capable
      timeout: 30
    gemini_flash:
      model: gemini-2.0-flash
      api_key: env:GOOGLE_API_KEY
      timeout: 30
    claude:
      model: claude-sonnet-4-20250514
      api_key: env:ANTHROPIC_API_KEY
      timeout: 60

  connections:
    default: keyword                # keyword | disabled

# Legacy LLM settings (still honored when providers are omitted)
# llm:
