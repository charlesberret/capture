[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-note"
version = "1.1.0"
description = "Quick multi-modal note capture with per-feature model providers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Charles Berret" },
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
test = [
    "pytest",
    "pyyaml",
]
ocr = [
    "pyobjc-core",
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
]
all = ["capture-note[yaml,ocr]"]

[project.scripts]
capture = "capture.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capture*"]

[tool.setuptools.package-data]
capture = [
    "core/prompts/*.txt",
    "platforms/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
